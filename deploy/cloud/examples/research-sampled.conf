# Staged example: install as a collector service drop-in only at deployment.
# Keep the separate executor in full mode. This changes recording, not trading.
[Service]
Environment=BTC15_RESEARCH_LOG_ENABLED=1
Environment=BTC15_RESEARCH_LOG_MODE=sampled
Environment=BTC15_RESEARCH_LOG_DIR=%h/Project15/research-logs
Environment=BTC15_RESEARCH_ARCHIVE_DIR=%h/Project15/research-logs-archive
