name: Validate observed exit liquidity and submission diagnostics

on:
  push:
    branches: [fix/fractional-passive-fills]
    paths: [.github/workflows/implement-liquidity-diagnostics.yml]

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TRADING_MODE: PAPER
      ENABLE_LIVE_TRADING: 'false'
      KALSHI_API_KEY_ID: ''
      KALSHI_PRIVATE_KEY_PATH: ''
      DATA_DIR: data/ci-liquidity
      DATABASE_URL: sqlite:///data/ci-liquidity.db
      BASE_SHA: 6cdd140103148a7fd04926954da2d96d7fad0674
    steps:
      - name: Check out exact approved baseline
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          git init .
          git remote add origin https://github.com/KhoaDao03/Project15.git
          git fetch --depth=1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --depth=1 origin "$BASE_SHA"
          git diff --exit-code "$BASE_SHA" HEAD -- . ':!.github/workflows/implement-liquidity-diagnostics.yml'
      - name: Install unchanged locked environment
        run: |
          python3 -m venv "$RUNNER_TEMP/btc15-tools"
          "$RUNNER_TEMP/btc15-tools/bin/pip" install uv==0.8.13
          echo "$RUNNER_TEMP/btc15-tools/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/btc15-tools/bin/uv" sync --python 3.12 --locked --extra dev
      - name: Load hash-pinned patch and test inputs
        env:
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          files = {
              '/tmp/liquidity_patch.py': 'e2b5d7fa3f84532141aec68dd68487b3e9509d66',
              '/tmp/liquidity_scope.py': 'f0af826c108e3d24b9ec5c513f5cb74e63a0dcf8',
              'tests/test_exit_liquidity_diagnostics.py': '51711aacf925e0ff1b6e455c453b2e93e65a9350',
          }
          for name, sha in files.items():
              request = urllib.request.Request(
                  'https://api.github.com/repos/KhoaDao03/Project15/git/blobs/' + sha,
                  headers={'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + os.environ['READ_TOKEN']},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              assert payload['encoding'] == 'base64'
              data = base64.b64decode(payload['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              Path(name).write_bytes(data)
              print('Verified input', name, sha)
          PY
      - name: Reproduce missed replenishment and generic rejection on baseline
        run: |
          uv run --no-sync python - <<'PY'
          import subprocess, xml.etree.ElementTree as ET
          report = '/tmp/liquidity-before.xml'
          result = subprocess.run([
              '.venv/bin/python', '-m', 'pytest', '-q', 'tests/test_exit_liquidity_diagnostics.py',
              '-k', 'observed_disappearance_replenishes_and_completes or disabled_dispatch_has_one_specific_rejection',
              '--junitxml=' + report, '--tb=line',
          ], capture_output=True, text=True)
          root = ET.parse(report).getroot()
          counts = tuple(len(root.findall('.//' + kind)) for kind in ('testcase', 'failure', 'error'))
          assert result.returncode == 1 and counts == (6, 6, 0), (counts, result.stdout, result.stderr)
          print('BASELINE_REPRODUCED: six expected failures, zero collection/setup errors')
          PY
      - name: Apply scoped fix and run focused tests
        run: |
          python3 /tmp/liquidity_patch.py
          python3 /tmp/liquidity_scope.py
          uv run --no-sync ruff check --select I --fix src/btc15/engine.py src/btc15/execution.py src/btc15/strategies/settlement_edge/rules.py tests/test_exit_liquidity_diagnostics.py
          uv run --no-sync ruff format src/btc15/engine.py src/btc15/execution.py src/btc15/strategies/settlement_edge/rules.py tests/test_exit_liquidity_diagnostics.py
          uv run --no-sync ruff check src tests
          uv run --no-sync pytest -q tests/test_exit_liquidity_diagnostics.py --tb=short
      - name: Full regression and safety-scope validation
        run: |
          uv run --no-sync pytest -q
          uv run --no-sync ruff check src tests
          uv run --no-sync ruff format --check src/btc15/engine.py src/btc15/execution.py src/btc15/strategies/settlement_edge/rules.py tests/test_exit_liquidity_diagnostics.py
          uv run --no-sync python -m compileall -q src tests
          node --check src/btc15/static/app.js
          uv build
          git diff --check
          git diff --exit-code "$BASE_SHA" -- src/btc15/domain.py src/btc15/strategies/settlement_edge/model.py src/btc15/strategies/settlement_edge/config.py src/btc15/runner.py src/btc15/recovery.py src/btc15/storage.py src/btc15/api.py src/btc15/models.py config pyproject.toml uv.lock
          uv run --no-sync python - <<'PY'
          import ast, os, subprocess
          from pathlib import Path
          path = 'src/btc15/strategies/settlement_edge/rules.py'
          old = ast.parse(subprocess.check_output(['git', 'show', os.environ['BASE_SHA'] + ':' + path], text=True))
          new = ast.parse(Path(path).read_text())
          for name in ('FeeAccumulator', 'fee_bound', 'evaluate', 'passive_price'):
              a = next(n for n in old.body if getattr(n, 'name', None) == name)
              b = next(n for n in new.body if getattr(n, 'name', None) == name)
              assert ast.dump(a) == ast.dump(b), name
          print('PROTECTED_RULES_PASS: fee accounting, fee bound, signal rules and passive pricing unchanged')
          PY
          git diff --stat
      - name: Publish passing changes and remove temporary workflow
        env:
          WRITE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(git ls-remote origin refs/heads/fix/fractional-passive-fills | cut -f1)" = "$(git rev-parse HEAD)"
          git rm .github/workflows/implement-liquidity-diagnostics.yml
          git add src/btc15/execution.py src/btc15/engine.py src/btc15/strategies/settlement_edge/rules.py src/btc15/static/app.js src/btc15/static/index.html tests/test_exit_liquidity_diagnostics.py docs/PAPER_TRADING.md docs/TROUBLESHOOTING.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: track observed exit replenishment and explain submission refusals'
          AUTH=$(printf 'x-access-token:%s' "$WRITE_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/fix/fractional-passive-fills
          echo "PUBLISHED_SHA=$(git rev-parse HEAD)"
