name: Validate explicit metadata settlement recovery

on:
  push:
    branches: [fix/fractional-passive-fills]
    paths: [.github/workflows/implement-settlement-recovery.yml]

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TRADING_MODE: PAPER
      ENABLE_LIVE_TRADING: 'false'
      KALSHI_API_KEY_ID: ''
      KALSHI_PRIVATE_KEY_PATH: ''
      DATA_DIR: data/ci-recovery
      DATABASE_URL: sqlite:///data/ci-recovery.db
      BASE_SHA: 82e07c5e988f926a23a25d5ae056bd0a14e545fb
    steps:
      - name: Check out exact approved baseline
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          git init .
          git remote add origin https://github.com/KhoaDao03/Project15.git
          git fetch --depth=1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --depth=1 origin "$BASE_SHA"
          git diff --exit-code "$BASE_SHA" HEAD -- . ':!.github/workflows/implement-settlement-recovery.yml'

      - name: Install unchanged locked environment
        run: |
          python3 -m venv "$RUNNER_TEMP/btc15-tools"
          "$RUNNER_TEMP/btc15-tools/bin/pip" install uv==0.8.13
          echo "$RUNNER_TEMP/btc15-tools/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/btc15-tools/bin/uv" sync --python 3.12 --locked --extra dev

      - name: Load hash-pinned implementation and regression inputs
        env:
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          files = {
              'src/btc15/recovery.py': '35a4625f35fc78ecfc9c03bedf13bb04c9e7fc04',
              'tests/test_settlement_recovery.py': 'e1d1279f3df36570e72ba8dbdc9b7c11f0265d0c',
              'docs/SETTLEMENT_RECOVERY.md': '29909998828d1a55b2403eccb441aecdb0a2d861',
              '/tmp/executor_methods.txt': 'af2279f6fc6fc1e3ae09472ea3fa472aa630fc8a',
              '/tmp/recovery_patch.py': 'd388ff6f807f00650cee081ce3c5740d65aa6d91',
          }
          for name, sha in files.items():
              request = urllib.request.Request(
                  'https://api.github.com/repos/KhoaDao03/Project15/git/blobs/' + sha,
                  headers={'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + os.environ['READ_TOKEN']},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              assert payload['encoding'] == 'base64'
              data = base64.b64decode(payload['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              Path(name).write_bytes(data)
              print('Verified input', name, sha)
          PY

      - name: Reproduce loss of contract identity on baseline
        run: |
          uv run --no-sync python - <<'PY'
          import subprocess, xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path('/tmp/recovery-before.xml')
          result = subprocess.run([
              '.venv/bin/python', '-m', 'pytest', '-q', 'tests/test_settlement_recovery.py',
              '-k', 'invalid_metadata_retains_position_and_settles or changed_metadata_recovers_with_final_original_terms',
              '--junitxml=' + str(report), '--tb=line',
          ], capture_output=True, text=True)
          root = ET.parse(report).getroot()
          counts = (len(root.findall('.//testcase')), len(root.findall('.//failure')), len(root.findall('.//error')))
          assert result.returncode == 1 and counts == (8, 8, 0), (counts, result.stdout, result.stderr)
          print('BASELINE_REPRODUCED: eight expected identity-retention failures; no setup errors')
          PY

      - name: Apply scoped recovery and run targeted tests
        run: |
          python3 /tmp/recovery_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/documentation-validation.yml')
          s = p.read_text()
          old = "'SINGLE_STRATEGY', 'SINGLE_STRATEGY_VALIDATION',"
          assert s.count(old) == 1
          p.write_text(s.replace(old, old + " 'SETTLEMENT_RECOVERY',"))
          PY
          uv run --no-sync ruff check --select I --fix tests/test_settlement_recovery.py
          uv run --no-sync ruff format src/btc15/recovery.py src/btc15/engine.py src/btc15/execution.py src/btc15/storage.py src/btc15/runner.py src/btc15/cli.py src/btc15/operation.py tests/test_settlement_recovery.py
          uv run --no-sync ruff check src tests
          uv run --no-sync pytest -q tests/test_settlement_recovery.py --tb=short

      - name: Complete regression, build and protected-scope checks
        run: |
          uv run --no-sync pytest -q
          uv run --no-sync ruff check src tests
          uv run --no-sync python -m compileall -q src tests
          node --check src/btc15/static/app.js
          uv build
          git diff --check
          git diff --exit-code "$BASE_SHA" -- src/btc15/strategies src/btc15/domain.py src/btc15/dashboard.py src/btc15/models.py config pyproject.toml uv.lock
          git diff --stat

      - name: Publish only passing changes and remove temporary workflow
        env:
          WRITE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(git ls-remote origin refs/heads/fix/fractional-passive-fills | cut -f1)" = "$(git rev-parse HEAD)"
          git rm .github/workflows/implement-settlement-recovery.yml
          git add src/btc15/recovery.py src/btc15/engine.py src/btc15/execution.py src/btc15/storage.py src/btc15/runner.py src/btc15/cli.py src/btc15/operation.py tests/test_settlement_recovery.py docs/SETTLEMENT_RECOVERY.md docs/README.md docs/SAFETY.md docs/POSITION_MANAGEMENT.md docs/TROUBLESHOOTING.md README.md .github/workflows/documentation-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve quarantined contracts and reconcile settlements with explicit evidence'
          AUTH=$(printf 'x-access-token:%s' "$WRITE_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/fix/fractional-passive-fills
          echo "PUBLISHED_SHA=$(git rev-parse HEAD)"
