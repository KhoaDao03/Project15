name: Validate entry and position-management separation

on:
  push:
    branches: [fix/fractional-passive-fills]
    paths: [.github/workflows/implement-position-management.yml]

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TRADING_MODE: PAPER
      ENABLE_LIVE_TRADING: 'false'
      KALSHI_API_KEY_ID: ''
      KALSHI_PRIVATE_KEY_PATH: ''
      DATA_DIR: data/ci-management
      DATABASE_URL: sqlite:///data/ci-management.db
      BASE_SHA: 55ab6811eb2ff96bd0b6331d7e5d75c7037e739e
    steps:
      - name: Check out exact approved baseline
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          git init .
          git remote add origin https://github.com/KhoaDao03/Project15.git
          git fetch --depth=1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --depth=1 origin "$BASE_SHA"
          git diff --exit-code "$BASE_SHA" HEAD -- . ':!.github/workflows/implement-position-management.yml'

      - name: Install unchanged locked dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/btc15-tools"
          "$RUNNER_TEMP/btc15-tools/bin/pip" install uv==0.8.13
          echo "$RUNNER_TEMP/btc15-tools/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/btc15-tools/bin/uv" sync --python 3.12 --locked --extra dev

      - name: Load hash-pinned review, tests and patch
        env:
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path
          files = {
              'tests/test_position_management.py': '73acdd14d913c373e225fa1e157ce937736b4a4c',
              'docs/POSITION_MANAGEMENT.md': '4642c5e498d63ff4fb88d5b5e6d38ace1661c0cc',
              str(Path(os.environ['RUNNER_TEMP']) / 'management_patch.py'): '887b21f5bd7c7c2df874e17bb93bb8072abf7f00',
          }
          for name, sha in files.items():
              request = urllib.request.Request(
                  'https://api.github.com/repos/KhoaDao03/Project15/git/blobs/' + sha,
                  headers={'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + os.environ['READ_TOKEN']},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              assert payload['encoding'] == 'base64'
              content = base64.b64decode(payload['content'])
              assert hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest() == sha
              Path(name).write_bytes(content)
              print('Verified input:', name, sha)
          PY

      - name: Prove the original shared gate blocks required exits
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP'])
          report = directory / 'management-before.xml'
          with (directory / 'management-before.log').open('w') as log:
              result = subprocess.run([
                  '.venv/bin/python', '-m', 'pytest', '-q', 'tests/test_position_management.py',
                  '-k', '(entry_policy_does_not_block_hard_stop and kill_switch) or price_exits_work_without_usable_model',
                  '--junitxml=' + str(report), '--tb=line',
              ], stdout=log, stderr=subprocess.STDOUT)
          root = ET.parse(report).getroot()
          cases = root.findall('.//testcase')
          failures = root.findall('.//failure')
          errors = root.findall('.//error')
          assert result.returncode == 1 and len(cases) == 36 and len(failures) == 36 and not errors, (result.returncode, len(cases), len(failures), len(errors), (directory / 'management-before.log').read_text())
          print('BASELINE_REPRODUCED: 36 expected exit-policy regressions, zero collection/setup errors')
          PY

      - name: Apply scoped engine and executor correction
        run: |
          python3 "$RUNNER_TEMP/management_patch.py"
          uv run --no-sync ruff format src/btc15/engine.py src/btc15/execution.py tests/test_position_management.py
          uv run --no-sync ruff check src tests
          uv run --no-sync pytest -q tests/test_position_management.py

      - name: Verify full suite, build, syntax and scope
        run: |
          uv run --no-sync pytest -q
          uv run --no-sync ruff check src tests
          uv run --no-sync ruff format --check src/btc15/engine.py src/btc15/execution.py tests/test_position_management.py
          uv run --no-sync python -m compileall -q src tests
          node --check src/btc15/static/app.js
          uv build
          git diff --check
          git diff --exit-code "$BASE_SHA" -- src/btc15/storage.py src/btc15/strategies src/btc15/domain.py src/btc15/runner.py src/btc15/dashboard.py src/btc15/models.py config pyproject.toml uv.lock
          git diff --stat

      - name: Publish only tested changes and remove temporary workflow
        env:
          WRITE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(git ls-remote origin refs/heads/fix/fractional-passive-fills | cut -f1)" = "$(git rev-parse HEAD)"
          git rm .github/workflows/implement-position-management.yml
          git add src/btc15/engine.py src/btc15/execution.py tests/test_position_management.py docs/POSITION_MANAGEMENT.md docs/SAFETY.md docs/STRATEGY.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: separate entry policy from safe existing-position management'
          AUTH=$(printf 'x-access-token:%s' "$WRITE_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/fix/fractional-passive-fills
          echo "PUBLISHED_SHA=$(git rev-parse HEAD)"
