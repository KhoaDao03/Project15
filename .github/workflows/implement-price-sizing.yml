name: Validate exact prices and sizing

on:
  push:
    branches: [fix/fractional-passive-fills]
    paths: [.github/workflows/implement-price-sizing.yml]

permissions:
  contents: write

concurrency:
  group: implement-price-sizing
  cancel-in-progress: false

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TRADING_MODE: PAPER
      ENABLE_LIVE_TRADING: 'false'
      KALSHI_API_KEY_ID: ''
      KALSHI_PRIVATE_KEY_PATH: ''
      DATA_DIR: data/ci-precision
      DATABASE_URL: sqlite:///data/ci-precision.db
      BASE_SHA: cb13f3b819d13dbe449f0b9f0b95652e8b752908
    steps:
      - name: Check out exact approved baseline
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          git init .
          git remote add origin https://github.com/KhoaDao03/Project15.git
          git fetch --depth=1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --depth=1 origin "$BASE_SHA"
          git diff --exit-code "$BASE_SHA" HEAD -- . ':!.github/workflows/implement-price-sizing.yml'
      - name: Install unchanged locked environment
        run: |
          python3 -m venv "$RUNNER_TEMP/btc15-tools"
          "$RUNNER_TEMP/btc15-tools/bin/pip" install uv==0.8.13
          echo "$RUNNER_TEMP/btc15-tools/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/btc15-tools/bin/uv" sync --python 3.12 --locked --extra dev
      - name: Fetch hash-verified patch and regression sources
        env:
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          blobs = {
              '/tmp/precision_patch.py': '0c000270a0352f9b835c8625e9daae7463f34d12',
              '/tmp/precision_support.py': 'be58840e2f583dd4fe2030aaf0c8133b09e3bbde',
              'tests/test_strategy_reverification.py': '4904a66dfc408b7bca8a752800f87189d226765e',
              'tests/test_precision_boundaries.py': 'cad70471565f3575e4ca9f69250022b876979c7d',
              'docs/PRICE_SIZING.md': '7b7fab332deafdf0e6afb4b38603a59b802dfb81',
          }
          for name, sha in blobs.items():
              req = urllib.request.Request(
                  'https://api.github.com/repos/KhoaDao03/Project15/git/blobs/' + sha,
                  headers={'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + os.environ['READ_TOKEN']},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  obj = json.load(response)
              assert obj['encoding'] == 'base64'
              data = base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              Path(name).write_bytes(data)
              print('VERIFIED_INPUT', name, sha)
          p = Path('tests/test_strategy_reverification.py')
          s = p.read_text().replace(
              'Independent review tests. All observations are synthetic; production code is unchanged.',
              'Strategy-conformance regressions. All observations and clocks are synthetic.',
          )
          s = s.replace('from test_position_management import scenario  # noqa: F401',
                        'import test_position_management as management_tests')
          s = s.replace('from btc15.strategies.settlement_edge.rules import Risk, passive_price\n',
                        'from btc15.strategies.settlement_edge.rules import Risk, passive_price\n\nscenario = management_tests.scenario\n')
          p.write_text(s)
          PY
      - name: Reproduce the original thirteen arithmetic failures
        run: |
          uv run --no-sync python - <<'PY'
          import subprocess, xml.etree.ElementTree as ET
          report = '/tmp/precision-before.xml'
          result = subprocess.run([
              '.venv/bin/python', '-m', 'pytest', '-q', 'tests/test_strategy_reverification.py',
              '-k', 'fixed_contracts_returns_five or passive_price_obeys_decimal or sell_price_does_not_lose',
              '--tb=line', '--junitxml=' + report,
          ], capture_output=True, text=True)
          root = ET.parse(report).getroot()
          counts = tuple(len(root.findall('.//' + kind)) for kind in ('testcase', 'failure', 'error'))
          assert result.returncode == 1 and counts == (13, 13, 0), (counts, result.stdout, result.stderr)
          print('BASELINE_REPRODUCED: thirteen arithmetic assertion failures, zero setup errors')
          PY
      - name: Apply focused correction and verify new boundary cases
        run: |
          python3 /tmp/precision_patch.py
          python3 /tmp/precision_support.py
          uv run --no-sync ruff check --select I,F401 --fix src/btc15/execution.py src/btc15/strategies/settlement_edge/rules.py tests/test_strategy_reverification.py tests/test_precision_boundaries.py tests/test_exit_liquidity_diagnostics.py
          uv run --no-sync ruff format src/btc15/execution.py src/btc15/strategies/settlement_edge/rules.py tests/test_strategy_reverification.py tests/test_precision_boundaries.py tests/test_exit_liquidity_diagnostics.py
          uv run --no-sync ruff check src tests
          uv run --no-sync pytest -q -s tests/test_strategy_reverification.py tests/test_precision_boundaries.py --tb=short --junitxml=/tmp/precision-after.xml
      - name: Full suite, builds and preserved-strategy checks
        run: |
          uv run --no-sync pytest -q --junitxml=/tmp/full-suite.xml
          uv run --no-sync ruff check src tests
          uv run --no-sync ruff format --check src/btc15/execution.py src/btc15/strategies/settlement_edge/rules.py tests/test_strategy_reverification.py tests/test_precision_boundaries.py tests/test_exit_liquidity_diagnostics.py
          uv run --no-sync python -m compileall -q src tests
          uv build
          git diff --check
          git diff --exit-code "$BASE_SHA" -- src/btc15/engine.py src/btc15/domain.py src/btc15/recovery.py src/btc15/storage.py src/btc15/runner.py src/btc15/dashboard.py src/btc15/static src/btc15/strategies/settlement_edge/model.py src/btc15/strategies/settlement_edge/config.py config pyproject.toml uv.lock
          python3 - <<'PY'
          import ast, os, subprocess
          from pathlib import Path
          for filename, names in (
              ('src/btc15/strategies/settlement_edge/rules.py', ['FeeAccumulator', 'fee_bound', 'evaluate']),
              ('src/btc15/execution.py', ['LiveTrader']),
          ):
              old = ast.parse(subprocess.check_output(['git', 'show', os.environ['BASE_SHA'] + ':' + filename], text=True))
              new = ast.parse(Path(filename).read_text())
              for name in names:
                  get = lambda tree: next(node for node in tree.body if getattr(node, 'name', '') == name)
                  assert ast.dump(get(old)) == ast.dump(get(new)), name
          print('PRESERVED: model, evaluation, fee formulas, presets, venue/recovery gates and live-order block')
          PY
      - name: Publish tested code to the working branch only
        env:
          WRITE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(git ls-remote origin refs/heads/fix/fractional-passive-fills | cut -f1)" = "$(git rev-parse HEAD)"
          git rm .github/workflows/implement-price-sizing.yml
          git add src/btc15/execution.py src/btc15/strategies/settlement_edge/rules.py tests/test_strategy_reverification.py tests/test_precision_boundaries.py tests/test_exit_liquidity_diagnostics.py docs/PRICE_SIZING.md docs/STRATEGY.md docs/MARKET_PAUSE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: use exact order-price and whole-contract budget arithmetic'
          AUTH=$(printf 'x-access-token:%s' "$WRITE_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/fix/fractional-passive-fills
          echo "PUBLISHED_SHA=$(git rev-parse HEAD)"
