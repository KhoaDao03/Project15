name: Validate persistent market-pause restriction

on:
  push:
    branches: [fix/fractional-passive-fills]
    paths: [.github/workflows/implement-market-pause.yml]

permissions:
  contents: write

concurrency:
  group: implement-market-pause
  cancel-in-progress: false

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRADING_MODE: PAPER
      ENABLE_LIVE_TRADING: 'false'
      KALSHI_API_KEY_ID: ''
      KALSHI_PRIVATE_KEY_PATH: ''
      DATA_DIR: data/ci-market-pause
      DATABASE_URL: sqlite:///data/ci-market-pause.db
      BASE_SHA: 745414e425fdefea90431b858d4645d3a605adf4
    steps:
      - name: Check out exact approved baseline
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          git init .
          git remote add origin https://github.com/KhoaDao03/Project15.git
          git fetch --depth=1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --depth=1 origin "$BASE_SHA"
          git diff --exit-code "$BASE_SHA" HEAD -- . ':!.github/workflows/implement-market-pause.yml'
      - name: Install unchanged locked dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/btc15-tools"
          "$RUNNER_TEMP/btc15-tools/bin/pip" install uv==0.8.13
          echo "$RUNNER_TEMP/btc15-tools/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/btc15-tools/bin/uv" sync --python 3.12 --locked --extra dev
      - name: Load hash-pinned patch, tests and runbook
        env:
          READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, urllib.request
          from pathlib import Path
          blobs = {
              '/tmp/market_pause_patch.py': 'e7d0a5e0c8a992c646c90940b0ce609164f301e4',
              'tests/test_market_pause.py': '86cb01129735dabb43e1ff0743b2fd9d5413bf21',
              'docs/MARKET_PAUSE.md': '81485aa47cca7756496482ee9d27d6381fc30e6f',
              '/tmp/test_original_reverification.py': '4904a66dfc408b7bca8a752800f87189d226765e',
          }
          for name, sha in blobs.items():
              request = urllib.request.Request(
                  'https://api.github.com/repos/KhoaDao03/Project15/git/blobs/' + sha,
                  headers={'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + os.environ['READ_TOKEN']},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              assert payload['encoding'] == 'base64'
              data = base64.b64decode(payload['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              Path(name).write_bytes(data)
              print('VERIFIED_INPUT', name, sha)
          test = Path('tests/test_market_pause.py')
          test.write_text(re.sub(r'\brequest\b', 'request_case', test.read_text()))
          patch = Path('/tmp/market_pause_patch.py')
          text = patch.read_text()
          text = text.replace('assert text.count(old) == 1,', 'assert text.count(old) == (2 if path == "src/btc15/static/app.js" and old == "const labels={PROCESSING_LAG:" else 1),')
          text = text.replace('text.replace(old, new, 1)', 'text.replace(old, new)')
          patch.write_text(text)
          PY
      - name: Reproduce the quote-after-deactivation failure before applying changes
        run: |
          uv run --no-sync python - <<'PY'
          import subprocess, xml.etree.ElementTree as ET
          report = '/tmp/market-pause-before.xml'
          result = subprocess.run([
              '.venv/bin/python', '-m', 'pytest', '-q', 'tests/test_market_pause.py',
              '-k', 'lifecycle_deactivation_does_not_allow_reentry', '--tb=line', '--junitxml=' + report,
          ], capture_output=True, text=True)
          root = ET.parse(report).getroot()
          counts = tuple(len(root.findall('.//' + kind)) for kind in ('testcase', 'failure', 'error'))
          print(result.stdout)
          assert result.returncode == 1 and counts == (4, 4, 0), (counts, result.stdout, result.stderr)
          print('BASELINE_REPRODUCED: four behavioral failures, zero setup/collection errors')
          PY
      - name: Apply scoped fix and verify targeted behavior
        run: |
          python3 /tmp/market_pause_patch.py
          uv run --no-sync ruff check --select I,F401 --fix src/btc15/engine.py src/btc15/execution.py src/btc15/runner.py src/btc15/dashboard.py tests/test_market_pause.py
          uv run --no-sync ruff format src/btc15/engine.py src/btc15/execution.py src/btc15/runner.py src/btc15/dashboard.py tests/test_market_pause.py
          uv run --no-sync ruff check src tests
          uv run --no-sync pytest -q tests/test_market_pause.py --tb=short
          cp /tmp/test_original_reverification.py tests/test_review_pause_temporary.py
          uv run --no-sync pytest -q tests/test_review_pause_temporary.py -k lifecycle_deactivation_does_not_allow_reentry --tb=short
          rm tests/test_review_pause_temporary.py
      - name: Full suite, builds and unchanged-strategy checks
        run: |
          uv run --no-sync pytest -q
          uv run --no-sync ruff check src tests
          uv run --no-sync ruff format --check src/btc15/engine.py src/btc15/execution.py src/btc15/runner.py src/btc15/dashboard.py tests/test_market_pause.py
          uv run --no-sync python -m compileall -q src tests
          node --check src/btc15/static/app.js
          uv build
          git diff --check
          git diff --exit-code "$BASE_SHA" -- src/btc15/domain.py src/btc15/strategies src/btc15/recovery.py src/btc15/storage.py src/btc15/api.py src/btc15/models.py config pyproject.toml uv.lock
          git diff --stat
      - name: Publish tested change to working branch only and remove temporary workflow
        env:
          WRITE_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin refs/heads/fix/fractional-passive-fills | cut -f1)" = "$(git rev-parse HEAD)"
          git rm .github/workflows/implement-market-pause.yml
          git add src/btc15/execution.py src/btc15/engine.py src/btc15/runner.py src/btc15/dashboard.py src/btc15/static/app.js src/btc15/static/index.html tests/test_market_pause.py docs/MARKET_PAUSE.md docs/PAPER_TRADING.md docs/TROUBLESHOOTING.md docs/POSITION_MANAGEMENT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: persist venue pauses until fresh authoritative active confirmation'
          AUTH=$(printf 'x-access-token:%s' "$WRITE_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/fix/fractional-passive-fills
          echo "PUBLISHED_SHA=$(git rev-parse HEAD)"
