[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "btc15-research"
version = "0.1.0"
description = "Settlement-aware Kalshi BTC15 research and paper trading"
requires-python = ">=3.12"
dependencies = ["numpy>=2.1,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pyarrow>=19,<24", "httpx>=0.28,<1", "websockets>=15,<17", "cryptography>=44", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-dotenv>=1,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[project.scripts]
btc15 = "btc15.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/btc15"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
